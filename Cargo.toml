[package]
name = "rsgit"
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["Artem Stasyuk <stasyukartem2@gmail.com>"]
description = "A TUI Git client built with Rust"
repository = "https://github.com/xcroatoanx/rsgit"
license = "MIT"

[dependencies]
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["bracketed-paste"] }
ratatui = "0.30.2"
strum = "0.28.0"
dirs = "7.0.0"
dunce = "1.0.5"
rayon = "1.12.0"

[profile.release]
lto = "thin"
strip = true
