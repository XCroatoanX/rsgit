name: Test and Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # 1. SMOKE TESTS
  # Runs tests, lints, and formatting checks on all target OSes.
  # ------------------------------------------------------------------
  smoke-test:
    name: Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --check

      - name: Lint with Clippy
        run: cargo clippy -- -D warnings

      - name: Run Tests
        run: cargo test --verbose

  # ------------------------------------------------------------------
  # 2. BUILD AND PACKAGE
  # Triggers only after smoke tests pass across all platforms.
  # ------------------------------------------------------------------
  package:
    name: Package (${{ matrix.job.target }})
    needs: smoke-test
    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  binary-ext: "",   archive-ext: "tar.gz" }
          - { os: macos-latest,   target: x86_64-apple-darwin,        binary-ext: "",   archive-ext: "tar.gz" }
          - { os: macos-latest,   target: aarch64-apple-darwin,       binary-ext: "",   archive-ext: "tar.gz" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     binary-ext: ".exe", archive-ext: "zip" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.job.target }}

      - name: Extract App Details
        id: app_info
        shell: bash
        run: |
          NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "NAME=$NAME" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.job.target }}

      - name: Prepare Package
        id: package_step
        shell: bash
        run: |
          APP_NAME="${{ steps.app_info.outputs.NAME }}"
          VERSION="${{ steps.app_info.outputs.VERSION }}"
          TARGET="${{ matrix.job.target }}"
          BIN_EXT="${{ matrix.job.binary-ext }}"
          ARCHIVE_EXT="${{ matrix.job.archive-ext }}"
          
          STAGE_DIR="${APP_NAME}-${VERSION}-${TARGET}"
          mkdir -p "${STAGE_DIR}"
          
          cp "target/${TARGET}/release/${APP_NAME}${BIN_EXT}" "${STAGE_DIR}/"
          [ -f README.md ] && cp README.md "${STAGE_DIR}/"
          [ -f LICENSE ] && cp LICENSE "${STAGE_DIR}/"
          
          ARCHIVE_NAME="${STAGE_DIR}.${ARCHIVE_EXT}"
          
          if [ "${ARCHIVE_EXT}" = "zip" ]; then
            7z a "${ARCHIVE_NAME}" "${STAGE_DIR}"
          else
            tar -czvf "${ARCHIVE_NAME}" "${STAGE_DIR}"
          fi
          
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.job.target }}
          path: ${{ steps.package_step.outputs.archive_name }}
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package_step.outputs.archive_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}