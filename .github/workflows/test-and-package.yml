name: Test and Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # 1. SMOKE TESTS
  # Runs tests, lints, and formatting checks across major host OSes.
  # ------------------------------------------------------------------
  smoke-test:
    name: Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --check

      - name: Lint with Clippy
        run: cargo clippy -- -D warnings

      - name: Run Tests
        run: cargo test --verbose

  # ------------------------------------------------------------------
  # 2. BUILD AND PACKAGE
  # Cross-compiles binaries for x86_64 and ARM64 on Linux, macOS, & Windows.
  # ------------------------------------------------------------------
  package:
    name: Package (${{ matrix.job.target }})
    needs: smoke-test
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # Linux x64
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  binary-ext: "",   archive-ext: "tar.gz", use-cross: false }
          # Linux ARM64 (cross-compiled via Docker)
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, binary-ext: "",   archive-ext: "tar.gz", use-cross: true  }
          # macOS Intel
          - { os: macos-latest,   target: x86_64-apple-darwin,        binary-ext: "",   archive-ext: "tar.gz", use-cross: false }
          # macOS Apple Silicon
          - { os: macos-latest,   target: aarch64-apple-darwin,       binary-ext: "",   archive-ext: "tar.gz", use-cross: false }
          # Windows x64
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     binary-ext: ".exe", archive-ext: "zip", use-cross: false }
          # Windows ARM64
          - { os: windows-latest, target: aarch64-pc-windows-msvc,    binary-ext: ".exe", archive-ext: "zip", use-cross: false }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.job.target }}

      - name: Install Cross (for Linux ARM64)
        if: matrix.job.use-cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Extract App Details
        id: app_info
        shell: bash
        run: |
          NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "NAME=$NAME" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Release Binary
        shell: bash
        run: |
          if [ "${{ matrix.job.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.job.target }}
          else
            cargo build --release --target ${{ matrix.job.target }}
          fi

      - name: Prepare Package
        id: package_step
        shell: bash
        run: |
          APP_NAME="${{ steps.app_info.outputs.NAME }}"
          VERSION="${{ steps.app_info.outputs.VERSION }}"
          TARGET="${{ matrix.job.target }}"
          BIN_EXT="${{ matrix.job.binary-ext }}"
          ARCHIVE_EXT="${{ matrix.job.archive-ext }}"
          
          STAGE_DIR="${APP_NAME}-${VERSION}-${TARGET}"
          mkdir -p "${STAGE_DIR}"
          
          cp "target/${TARGET}/release/${APP_NAME}${BIN_EXT}" "${STAGE_DIR}/"
          [ -f README.md ] && cp README.md "${STAGE_DIR}/"
          [ -f LICENSE ] && cp LICENSE "${STAGE_DIR}/"
          
          ARCHIVE_NAME="${STAGE_DIR}.${ARCHIVE_EXT}"
          
          if [ "${ARCHIVE_EXT}" = "zip" ]; then
            7z a "${ARCHIVE_NAME}" "${STAGE_DIR}"
          else
            tar -czvf "${ARCHIVE_NAME}" "${STAGE_DIR}"
          fi
          
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.job.target }}
          path: ${{ steps.package_step.outputs.archive_name }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 3. PUBLISH GITHUB RELEASE
  # Runs ONCE after all binary packages are successfully built.
  # ------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}